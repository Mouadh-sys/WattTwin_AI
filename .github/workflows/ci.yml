name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Tests
        run: pytest

  # The frontend is still the pre-existing mock prototype. Its build gate is added once
  # it type-checks against the real API client (Phase 1). It is deliberately not in CI
  # while it would only produce a false green.
